# add-on

addon.eebus.name = EEBus Binding
addon.eebus.description = This binding lets openHAB present itself as an EEBus Controllable System, so a smart-meter CLS gateway or energy management system can pair with it and issue LPC (Limitation of Power Consumption) and LPP (Limitation of Power Production) power limits, e.g. for §14a EnWG compliance in Germany.

# thing types

thing-type.eebus.controllableSystem.label = EEBus Controllable System
thing-type.eebus.controllableSystem.description = A local EEBus SHIP/SPINE node that presents openHAB as an EEBus Controllable System (CS). A remote CEM/EMS or smart-meter CLS gateway pairs with this node and issues LPC/LPP power limits.
thing-type.eebus.controllableSystem.channel.lpcActiveLimit.label = LPC Active Limit
thing-type.eebus.controllableSystem.channel.lpcActiveLimit.description = The currently active consumption power limit.
thing-type.eebus.controllableSystem.channel.lpcActiveLimitDuration.label = LPC Active Limit Duration
thing-type.eebus.controllableSystem.channel.lpcActiveLimitDuration.description = ISO 8601 duration the current consumption limit remains valid for, if any.
thing-type.eebus.controllableSystem.channel.lpcEvent.label = LPC Event
thing-type.eebus.controllableSystem.channel.lpcEvent.description = Fires when the LPC state machine transitions state.
thing-type.eebus.controllableSystem.channel.lpcState.label = LPC State
thing-type.eebus.controllableSystem.channel.lpcState.description = State of the Limitation of Power Consumption controllable-system state machine.
thing-type.eebus.controllableSystem.channel.lppActiveLimit.label = LPP Active Limit
thing-type.eebus.controllableSystem.channel.lppActiveLimit.description = The currently active production power limit.
thing-type.eebus.controllableSystem.channel.lppActiveLimitDuration.label = LPP Active Limit Duration
thing-type.eebus.controllableSystem.channel.lppActiveLimitDuration.description = ISO 8601 duration the current production limit remains valid for, if any.
thing-type.eebus.controllableSystem.channel.lppEvent.label = LPP Event
thing-type.eebus.controllableSystem.channel.lppEvent.description = Fires when the LPP state machine transitions state.
thing-type.eebus.controllableSystem.channel.lppState.label = LPP State
thing-type.eebus.controllableSystem.channel.lppState.description = State of the Limitation of Power Production controllable-system state machine.

# thing types config

thing-type.config.eebus.controllableSystem.autoAcceptPairing.label = Auto-Accept Pairing Requests
thing-type.config.eebus.controllableSystem.autoAcceptPairing.description = Accept any pairing request without a pre-trusted SKI. Only intended for lab testing against a simulator - never enable this against a production installation.
thing-type.config.eebus.controllableSystem.bindAddress.label = Bind Address
thing-type.config.eebus.controllableSystem.bindAddress.description = Local IP address the SHIP WebSocket server binds to. Use 0.0.0.0 to bind all interfaces.
thing-type.config.eebus.controllableSystem.connectPolicy.label = Connect Policy
thing-type.config.eebus.controllableSystem.connectPolicy.description = Which remote SHIP nodes are allowed to connect. TRUSTED only accepts nodes whose SKI is listed below; ALL accepts any node (not recommended); NONE rejects new pairings.
thing-type.config.eebus.controllableSystem.connectPolicy.option.TRUSTED = Trusted SKIs only
thing-type.config.eebus.controllableSystem.connectPolicy.option.ALL = All (insecure)
thing-type.config.eebus.controllableSystem.connectPolicy.option.NONE = None
thing-type.config.eebus.controllableSystem.deviceId.label = Device ID
thing-type.config.eebus.controllableSystem.deviceId.description = Unique SPINE device identifier for this node. Change the default to something unique to your installation before pairing with a real EEBus partner.
thing-type.config.eebus.controllableSystem.deviceType.label = SPINE Device Type
thing-type.config.eebus.controllableSystem.deviceType.description = SPINE device type reported to pairing partners.
thing-type.config.eebus.controllableSystem.deviceType.option.GENERIC = Generic
thing-type.config.eebus.controllableSystem.deviceType.option.ENERGY_MANAGEMENT_SYSTEM = Energy Management System
thing-type.config.eebus.controllableSystem.deviceType.option.CHARGING_STATION = Charging Station
thing-type.config.eebus.controllableSystem.deviceType.option.HEAT_GENERATION_SYSTEM = Heat Generation System
thing-type.config.eebus.controllableSystem.deviceType.option.HEAT_SINK_SYSTEM = Heat Sink System
thing-type.config.eebus.controllableSystem.deviceType.option.HEAT_STORAGE_SYSTEM = Heat Storage System
thing-type.config.eebus.controllableSystem.deviceType.option.ELECTRICITY_SUPPLY_SYSTEM = Electricity Supply System
thing-type.config.eebus.controllableSystem.deviceType.option.INVERTER = Inverter
thing-type.config.eebus.controllableSystem.deviceType.option.SUB_METER = Sub Meter
thing-type.config.eebus.controllableSystem.entityType.label = SPINE Entity Type
thing-type.config.eebus.controllableSystem.entityType.description = SPINE entity type hosting the LPC/LPP use cases. Limited to the entity types the jEEBus LPC/LPP implementation actually allows (verified live against a real EEBus partner) - CEM is the correct default for a generic controllable system; pick a more specific type (e.g. EVSE, HEAT_PUMP_APPLIANCE) if your partner requires it.
thing-type.config.eebus.controllableSystem.entityType.option.CEM = CEM (generic controllable system)
thing-type.config.eebus.controllableSystem.entityType.option.COMPRESSOR = Compressor
thing-type.config.eebus.controllableSystem.entityType.option.EVSE = EVSE
thing-type.config.eebus.controllableSystem.entityType.option.HEAT_PUMP_APPLIANCE = Heat Pump Appliance
thing-type.config.eebus.controllableSystem.entityType.option.INVERTER = Inverter
thing-type.config.eebus.controllableSystem.entityType.option.SMART_ENERGY_APPLIANCE = Smart Energy Appliance
thing-type.config.eebus.controllableSystem.entityType.option.SUB_METER_ELECTRICITY = Sub Meter Electricity
thing-type.config.eebus.controllableSystem.friendlyName.label = Friendly Name
thing-type.config.eebus.controllableSystem.friendlyName.description = Human-readable name advertised to pairing partners.
thing-type.config.eebus.controllableSystem.group.identity.label = SHIP/SPINE Identity
thing-type.config.eebus.controllableSystem.group.lpc.label = LPC (Consumption Limitation)
thing-type.config.eebus.controllableSystem.group.lpp.label = LPP (Production Limitation)
thing-type.config.eebus.controllableSystem.group.network.label = Network
thing-type.config.eebus.controllableSystem.group.pairing.label = Pairing
thing-type.config.eebus.controllableSystem.lpcEnabled.label = Enable LPC
thing-type.config.eebus.controllableSystem.lpcEnabled.description = Expose the Limitation of Power Consumption use case.
thing-type.config.eebus.controllableSystem.lpcFailsafeDuration.label = Failsafe Duration
thing-type.config.eebus.controllableSystem.lpcFailsafeDuration.description = ISO 8601 duration the failsafe limit is considered valid for after communication is lost (e.g. PT2H for 2 hours).
thing-type.config.eebus.controllableSystem.lpcFailsafeLimitWatts.label = Failsafe Consumption Limit
thing-type.config.eebus.controllableSystem.lpcFailsafeLimitWatts.description = Limit applied automatically if the pairing partner stops sending heartbeats. Review and lower this to a value your installation's wiring/fuse can safely sustain unattended - it does NOT default to a safe value automatically.
thing-type.config.eebus.controllableSystem.lpcNominalMaxWatts.label = Nominal Max Consumption
thing-type.config.eebus.controllableSystem.lpcNominalMaxWatts.description = The maximum power this installation could ever consume, reported to the CEM as the LPC nominal max value.
thing-type.config.eebus.controllableSystem.lppEnabled.label = Enable LPP
thing-type.config.eebus.controllableSystem.lppEnabled.description = Expose the Limitation of Power Production use case.
thing-type.config.eebus.controllableSystem.lppFailsafeDuration.label = Failsafe Duration
thing-type.config.eebus.controllableSystem.lppFailsafeDuration.description = ISO 8601 duration the failsafe limit is considered valid for after communication is lost (e.g. PT2H for 2 hours).
thing-type.config.eebus.controllableSystem.lppFailsafeLimitWatts.label = Failsafe Production Limit
thing-type.config.eebus.controllableSystem.lppFailsafeLimitWatts.description = Limit applied automatically if the pairing partner stops sending heartbeats. Review and set this to a value appropriate for your installation - it does NOT default to a safe value automatically.
thing-type.config.eebus.controllableSystem.lppNominalMaxWatts.label = Nominal Max Production
thing-type.config.eebus.controllableSystem.lppNominalMaxWatts.description = The maximum power this installation could ever feed in, reported to the CEM as the LPP nominal max value.
thing-type.config.eebus.controllableSystem.port.label = Port
thing-type.config.eebus.controllableSystem.port.description = TCP port the SHIP WebSocket server listens on. EEBus does not mandate a fixed port; remote nodes find it via mDNS.
thing-type.config.eebus.controllableSystem.serviceDomain.label = mDNS Domain
thing-type.config.eebus.controllableSystem.serviceDomain.description = mDNS domain used for SHIP service advertisement/discovery.
thing-type.config.eebus.controllableSystem.trustedSkis.label = Trusted SKIs
thing-type.config.eebus.controllableSystem.trustedSkis.description = Comma-separated list of remote SHIP Subject Key Identifiers (SKIs) to pre-trust, e.g. the SKI printed on your CLS gateway. Only used when Connect Policy is "Trusted SKIs only".
thing-type.config.eebus.controllableSystem.wssPath.label = WebSocket Path
thing-type.config.eebus.controllableSystem.wssPath.description = HTTP path the SHIP WebSocket endpoint is served under.

# channel types

channel-type.eebus.activeLimit.label = Active Limit
channel-type.eebus.activeLimit.description = Currently active power limit as reported by the state machine.
channel-type.eebus.activeLimitDuration.label = Active Limit Duration
channel-type.eebus.activeLimitDuration.description = ISO 8601 duration the active limit remains valid for, if reported by the pairing partner.
channel-type.eebus.csEvent.label = Controllable System Event
channel-type.eebus.csEvent.description = Fires whenever the controllable-system state machine processes an event.
channel-type.eebus.csState.label = Controllable System State
channel-type.eebus.csState.description = Current state of the controllable-system state machine.
channel-type.eebus.csState.state.option.INIT = Init
channel-type.eebus.csState.state.option.CONTROLLED = Controlled
channel-type.eebus.csState.state.option.LIMITED = Limited
channel-type.eebus.csState.state.option.FAILSAFE = Failsafe
channel-type.eebus.csState.state.option.AUTONOMOUS = Autonomous
channel-type.eebus.ownSki.label = Own SKI
channel-type.eebus.ownSki.description = This node's own Subject Key Identifier. Give this to your CLS gateway/EMS installer to pre-trust this node.
